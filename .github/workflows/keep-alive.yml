name: Keep Strapi Alive

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes
  workflow_dispatch:         # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Strapi
        run: |
          curl -sf "https://techdrive-strapi.onrender.com/api/articles?pagination[limit]=1" \
            -o /dev/null \
            --max-time 60 \
            && echo "Strapi is up" \
            || echo "Strapi warming up (cold start)"
